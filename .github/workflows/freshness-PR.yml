name: Freshness PR

# QKG_083 — semi-automated freshness PRs.
#
# Runs weekly (Monday 09:00 UTC) or on manual dispatch. Calls
# check_freshness.py to compare graphs.lock pins against upstream HEAD.
# If any lib is stale, opens a GitHub PR (informational, never auto-merges)
# so staleness is visible via GitHub notifications.

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check freshness
        run: python3 scripts/check_freshness.py --ci > freshness-report.json || true
      - name: Create PR if stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STALE=$(python3 -c "import json; d=json.load(open('freshness-report.json')); print(d['stale'])")
          if [ "$STALE" != "0" ]; then
            BRANCH="freshness/fresh-$(date +%Y%m%d)"
            git checkout -b "$BRANCH"
            git add freshness-report.json
            git commit -m "chore: freshness report — $STALE libs stale"
            git push origin "$BRANCH"
            gh pr create --title "chore: freshness check — $STALE libs stale" --body "$(cat freshness-report.json)" --label freshness || true
          else
            echo "All libs current"
          fi
