name: Graph Freshness Check

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:      # Manual trigger

jobs:
  check-scikit-learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      
      - name: Clone latest scikit-learn
        run: |
          git clone --depth 1 https://github.com/scikit-learn/scikit-learn.git /tmp/sklearn-latest
          LATEST=$(cd /tmp/sklearn-latest && git rev-parse --short HEAD)
          CURRENT=$(python3 -c "import json; g=json.load(open('knowledge_graphs/scikit-learn/.graphify/graph.json')); print(g.get('git_commit','unknown'))")
          echo "LATEST=$LATEST" >> $GITHUB_ENV
          echo "CURRENT=$CURRENT" >> $GITHUB_ENV
          echo "Latest: $LATEST, Current: $CURRENT"
      
      - name: Check if stale
        id: check
        run: |
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "stale=true" >> $GITHUB_OUTPUT
            echo "Graph is stale — upstream has changed"
          else
            echo "stale=false" >> $GITHUB_OUTPUT
            echo "Graph is fresh"
          fi
      
      - name: Re-extract if stale
        if: steps.check.outputs.stale == 'true'
        run: |
          echo "Re-extraction requires LLM API keys — triggering manual review PR instead"
          # Create a marker file
          date > knowledge_graphs/scikit-learn/.graphify/STALE_MARKER
      
      - name: Create PR if stale
        if: steps.check.outputs.stale == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "ci: scikit-learn graph stale — upstream ${{ env.LATEST }}"
          title: "⬆️ scikit-learn graph stale: ${{ env.CURRENT }} → ${{ env.LATEST }}"
          body: |
            Upstream scikit-learn has new commits since last extraction.
            
            **Current**: `${{ env.CURRENT }}`
            **Latest**: `${{ env.LATEST }}`
            
            Manual re-extraction needed:
            ```bash
            cd knowledge_graphs/scikit-learn/repo && git pull && graphify --update .
            ```

  check-optuna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone latest optuna
        run: |
          git clone --depth 1 https://github.com/optuna/optuna.git /tmp/optuna-latest
          LATEST=$(cd /tmp/optuna-latest && git rev-parse --short HEAD)
          CURRENT=$(python3 -c "import json; g=json.load(open('knowledge_graphs/optuna/.graphify/graph.json')); print(g.get('git_commit','unknown'))")
          echo "LATEST=$LATEST" >> $GITHUB_ENV
          echo "CURRENT=$CURRENT" >> $GITHUB_ENV
      
      - name: Create PR if stale
        if: env.LATEST != env.CURRENT
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "ci: optuna graph stale — upstream ${{ env.LATEST }}"
          title: "⬆️ optuna graph stale: ${{ env.CURRENT }} → ${{ env.LATEST }}"
          body: |
            Upstream optuna has new commits. Manual re-extraction needed.
