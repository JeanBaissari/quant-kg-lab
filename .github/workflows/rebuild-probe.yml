name: Rebuild Probe

# QKG_054 / QKG_083 — weekly STRUCTURAL reproducibility probe.
#
# Re-extracts seven sample libraries from their graphs.lock pins (graphify
# extract-only: local tree-sitter AST + Louvain, NO LLM) and diffs node/edge
# counts against graphs.lock. Proves "the pinned commit still extracts to the
# same shape" — the structural half of reproducibility.
#
# Libs span 5 build profiles: 2 pure-Python, 2 C/C++ extension, 1 system-dep,
# 1 large monorepo, 1 small HTTP-based.  Expanded from 2 → 7 in QKG_083.
#
# Explicitly INFORMATIONAL: this job never blocks, never PRs, never writes.
# Full semantic rebuilds (c2 ≥80% descriptions) are NOT CI-automatable — the
# describe loop needs the opencode LLM backend (human-in-the-loop, manual).

on:
  schedule:
    - cron: '30 8 * * 1'   # Mondays 08:30 UTC, after the freshness probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install graphify (isolated, per install_graphify.sh)
        run: |
          mkdir -p .graphify-cli
          printf '{"name":"graphify-cli-install","version":"1.0.0","private":true}\n' > .graphify-cli/package.json
          (cd .graphify-cli && npm i "@sentropic/graphify@0.17.1" --no-audit --no-fund)
      - name: Extract 7 sample libs at pin + diff vs graphs.lock
        run: |
          export GRAPHIFY_CLI="$PWD/.graphify-cli/node_modules/@sentropic/graphify/dist/cli.js"
          export LOCK="$GITHUB_WORKSPACE/graphs.lock"
          # QKG_083: 7 libs across 5 build profiles
          #   pure-Python:    empyrical (dead), pyportfolioopt
          #   C/C++ extension: scipy, xgboost
          #   system C lib:   ta-lib
          #   large monorepo: pandas
          #   small HTTP:     yfinance
          for lib in empyrical pyportfolioopt scipy xgboost ta-lib pandas yfinance; do
            commit=$(python3 -c "import json; print(json.load(open(os.environ['LOCK']))['libraries']['$lib']['commit'])")
            repo=$(python3 -c "import json; print(json.load(open(os.environ['LOCK']))['libraries']['$lib']['repo'])")
            echo "== $lib @ $commit =="
            rm -rf /tmp/probe-$lib && mkdir -p /tmp/probe-$lib && cd /tmp/probe-$lib
            git clone --quiet --filter=blob:none "https://github.com/$repo" repo
            git -C repo fetch --quiet --depth 1 origin "$commit" || git -C repo fetch --quiet origin
            git -C repo checkout --quiet "$commit"
            # Package subdirs matching rebuild_graph.sh pkg_subdir()
            case "$lib" in
              pyportfolioopt) pkg=repo/pypfopt;;
              xgboost)        pkg=repo/python-package/xgboost;;
              ta-lib)         pkg=repo/talib;;
              *)              pkg=repo;;
            esac
            node "$GRAPHIFY_CLI" extract "$pkg" --out "$PWD/out" --no-description --no-label \
              --exclude 'tests/**' --exclude 'tests/' --exclude 'test_*' --exclude 'benchmarks/**' \
              --exclude 'examples/**' --exclude 'docs/**' --exclude '*.pyx' --exclude '*.txt' \
              --exclude '*.html' --exclude '*.m' --exclude '*.R' --exclude '*.f90' >/dev/null 2>&1
            python3 <<'EOF'
            import json, os
            g = json.load(open('$PWD/out/graph.json'))
            lock = json.load(open(os.environ['LOCK']))
            exp = lock['libraries']['$lib']
            actual = (len(g['nodes']), len(g['links']))
            want = (exp['nodes'], exp['edges'])
            print(f'  extracted {actual} vs lock {want} ->', 'MATCH' if actual == want else 'DRIFT')
            EOF
          done
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-probe
          path: /tmp/probe-*
          retention-days: 30
