name: Skill Validation

on:
  push:
    paths:
      - 'skills/**'
      - 'scripts/validate_skills.py'
      - 'scripts/normalize_skills.py'
      - 'docs/specs/SKILL_SPEC.md'
      - 'graphs.lock'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/validate_skills.py'
      - 'graphs.lock'
  schedule:
    - cron: '0 6 * * *'   # QKG_054: nightly validation keeps the evidence permanent
  workflow_dispatch:

jobs:
  lint:
    # Fast, deterministic GATE: frontmatter schema, unique "Use when" names, no
    # dangling references/, source_commit matches graphs.lock, routers exist,
    # required sections + graph_hash + related_skills resolution (QKG_007),
    # and every QR graph-node citation resolves in the committed graphs (QKG_012).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Lint skills against docs/specs/SKILL_SPEC.md
        run: python scripts/validate_skills.py --ci
      - name: Verify graph-node citations resolve (QKG_012)
        run: python scripts/verify_citations.py
      - name: Verify QR rows are complete for every library (QKG_021/033, GRAPH_SPEC c6)
        run: |
          for lib in $(python3 -c "import json; print(' '.join(json.load(open('graphs.lock'))['libraries']))"); do
            python scripts/verify_citations.py --require-complete "$lib"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-validation-report
          path: docs/reference/skill-validation-report.json

  api:
    # GATE: validate skill claims against the LIVE installed APIs + provenance.
    # TA-Lib's C library is built from source so ta-lib skills really validate.
    # A hallucinated symbol fails the PR check (QKG_008).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build system TA-Lib C library
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential wget
          cd /tmp && wget -q https://github.com/TA-Lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
          tar xzf ta-lib-0.6.4-src.tar.gz && cd ta-lib-0.6.4
          ./configure --prefix=/usr >/dev/null && make -j2 >/dev/null && sudo make install >/dev/null
      - name: Install target libraries
        run: |
          pip install pyyaml numpy scipy pandas scikit-learn optuna vectorbt xgboost lightgbm backtrader TA-Lib
      - name: Validate skills against live APIs + provenance (strict)
        run: python scripts/validate_skills.py --strict --provenance
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-validation-report-full
          path: docs/reference/skill-validation-report.json

  publish:
    # QKG_054: on schedule only, commit the fresh reports back so the evidence is
    # permanent (artifacts expire in 90 days) and the Pages status stays current.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [lint, api]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Regenerate reports (gate + citations + validate + status)
        run: |
          python3 scripts/graph_gate.py --ci --all || true
          python3 scripts/verify_citations.py || true
          python3 scripts/validate_skills.py --ci || true
          python3 scripts/doc_audit.py --write || true
          python3 scripts/build_site.py
          python3 scripts/emit_badge.py
      - name: Commit report refresh (if changed)
        run: |
          git config user.name "qkg-bot"
          git config user.email "qkg-bot@users.noreply.github.com"
          git add docs/reference/*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh validation reports (nightly, QKG_054)" || true
            git push origin main || true
          else
            echo "no report drift — nothing to commit"
          fi
